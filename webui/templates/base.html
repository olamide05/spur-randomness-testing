<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spur &mdash; STS Test Runner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <main class="wrap">
    {% block masthead %}
    <div class="masthead">
      <p class="eyebrow">NIST SP 800-22 &middot; Spur</p>
      <h1>STS Test Runner</h1>
      <nav class="site-nav">
        <a href="{{ url_for('index') }}" {% if request.path == url_for('index') %}class="active"{% endif %}>Run assessment</a>
        <a href="{{ url_for('examples') }}" {% if request.path == url_for('examples') %}class="active"{% endif %}>Examples</a>
        <a href="{{ url_for('history') }}" {% if request.path == url_for('history') %}class="active"{% endif %}>History</a>
      </nav>
    </div>
    {% endblock %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
